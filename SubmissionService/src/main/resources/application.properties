spring.application.name=SubmissionService
server.port=8083

# Disable Docker Compose support
spring.docker.compose.enabled=false

# MongoDB Configuration with Authentication
spring.data.mongodb.uri=mongodb://ravindra162:7065@localhost:27017/submissiondb?authSource=admin

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Storage Configuration (for future S3/MinIO integration)
storage.type=local
storage.local.path=/tmp/submissions

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Logging
logging.level.com.Submission.SubmissionService=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Piston API Configuration for Code Execution
piston.api.url=https://emkc.org/api/v2/piston

# JWT Configuration
jwt.secret=your_jwt_secret_key_here_make_it_very_long_and_secure
