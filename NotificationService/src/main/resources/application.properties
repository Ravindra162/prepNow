spring.application.name=NotificationService

server.port=8086

# Disable Docker Compose support
spring.docker.compose.enabled=false

# Exclude JPA and DataSource auto-configuration (using MongoDB only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# MongoDB Configuration with Authentication
spring.data.mongodb.uri=mongodb://ravindra162:7065@localhost:27018/notificationDB?authSource=admin

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ravnarravnar@gmail.com
spring.mail.password=hnvk hnab mdsf also
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Configuration
app.email.from=${EMAIL_FROM:noreply@prepnow.com}
app.email.from-name=PrepNow Platform

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.NotificationService.NotificationService=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.amqp=DEBUG
